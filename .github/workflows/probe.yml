name: Probe 26.2
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {java-version: '25', distribution: 'temurin'}
      - uses: gradle/actions/setup-gradle@v5
      - run: |
          chmod +x gradlew
          sed -i 's/^minecraft_version=.*/minecraft_version=26.2/' gradle.properties
          ./gradlew dependencies --configuration compileClasspath >/dev/null 2>&1 || true
          find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -i 26.2 | grep -v sources | head -5
          for j in $(find ~/.gradle/caches .gradle -name '*.jar' 2>/dev/null | grep -i minecraft | grep -i 26.2 | grep -v sources | head -3); do echo "## $j"; unzip -l "$j" | awk '{print $4}' | grep -i -E "vulkan|renderpearl|GpuBackend|BackendCreation|GraphicsBackend" | head -15; done
