name: Probe Voxy
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: {java-version: '25', distribution: 'temurin'}
      - run: |
          for v in 26.2 26.3; do
            url=$(curl -s "https://api.modrinth.com/v2/project/voxy/version?game_versions=%5B%22$v%22%5D&loaders=%5B%22fabric%22%5D" | python3 -c "import json,sys; d=json.load(sys.stdin); f=[x for x in d[0]['files'] if x['primary']] or d[0]['files']; print(d[0]['version_number'], f[0]['url'])")
            echo "## $v: $url"; curl -sL -o voxy.jar "${url#* }"
            javap -cp voxy.jar -p me.cortex.voxy.client.VoxyClient | grep -i "initVoxyClient" || echo "NO initVoxyClient"
            unzip -o -q voxy.jar -d voxy-$v
            grep -rl "Voxy does not presently support vulkan" voxy-$v | head -3 || true
            grep -rl -a "forceOpenglDevice" voxy-$v | head -3 || true
          done
