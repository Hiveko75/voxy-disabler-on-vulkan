name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build for Minecraft ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew build -Pmc=${{ matrix.mc }} --stacktrace
          rm -f build/libs/*-sources.jar
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-disabler-on-vulkan-${{ matrix.mc }}
          path: build/libs/*.jar
