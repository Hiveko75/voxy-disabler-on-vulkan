name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Compile against every supported Minecraft version (versions/*.properties) and make sure the
  # bytecode is identical, so the single jar works on all of them.
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mc: ['26.2', '26.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Compile against Minecraft ${{ matrix.mc }}
        run: |
          chmod +x ./gradlew
          ./gradlew compileJava -Pmc=${{ matrix.mc }} --stacktrace
          mkdir -p javap
          for c in $(cd build/classes/java/main && find . -name '*.class' | sort); do
            javap -c -p -v "build/classes/java/main/$c" | grep -v -E '^(Classfile|  Last modified|  SHA-256|  MD5 checksum)' > "javap/$(echo ${c#./} | tr / _).txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: javap-${{ matrix.mc }}
          path: javap/

  compare:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: javap-*
      - name: Bytecode identical on all versions
        run: diff -r javap-26.2 javap-26.3 && echo identical

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace
          rm -f build/libs/*-sources.jar
          ls -l build/libs
      - uses: actions/upload-artifact@v4
        with:
          name: voxy-disabler-on-vulkan
          path: build/libs/*.jar
