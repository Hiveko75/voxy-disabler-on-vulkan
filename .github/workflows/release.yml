# Builds the jar(s) and publishes them as a GitHub release.
# Run from the Actions tab: Release -> Run workflow (the tag defaults to mod_version).
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (empty = mod_version from gradle.properties)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v5
      - name: Build
        run: |
          chmod +x ./gradlew
          mkdir dist
          for mc in 26.2 26.3; do ./gradlew clean build -Pmc=$mc --stacktrace; cp build/libs/*+mc$mc.jar dist/; done
          rm -f dist/*-sources.jar
          ls -l dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.tag }}"
          [ -n "$TAG" ] || TAG=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          cat > notes.md <<'NOTES'
          With **Vulkan** selected as the graphics API, the game stays on Vulkan and [Voxy](https://modrinth.com/mod/voxy) switches itself off for that session (Voxy only renders with OpenGL). With OpenGL, Voxy works as before. Voxy itself is not modified or included.

          - **New:** Minecraft **26.2** support. On 26.2, Voxy does not block Vulkan by itself, so this keeps Voxy off there as well.

          | File | Minecraft |
          |---|---|
          | `voxy-disabler-on-vulkan-*+mc26.2.jar` | 26.2 |
          | `voxy-disabler-on-vulkan-*+mc26.3.jar` | 26.3 and newer |

          Requires Voxy. Client-side only.
          NOTES
          sed -i 's/^          //' notes.md
          gh release create "$TAG" dist/*.jar --target "$GITHUB_SHA" --title "Voxy Disabler on Vulkan $TAG" --notes-file notes.md
