plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def mc = (findProperty('mc') ?: project.mc_default).toString()
def v = new Properties()
file("versions/${mc}.properties").withInputStream { v.load(it) }

version = "${project.mod_version}+mc${mc}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

sourceSets.main.java.srcDir "platform/mc${mc}/java"

dependencies {
    minecraft "com.mojang:minecraft:${v.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${v.loader_version}"
    // Voxy is not needed at compile time: its classes are targeted by name only,
    // so no Voxy code is copied or bundled into this jar.
}

processResources {
    def props = [version: project.version, minecraft_range: v.minecraft_range]
    inputs.properties props
    filesMatching("fabric.mod.json") {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = 25
}

java {
    if (JavaVersion.current() < JavaVersion.toVersion(25)) {
        toolchain.languageVersion = JavaLanguageVersion.of(25)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
